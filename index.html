<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Congratulations on your deployment! 🍎</title>
    <meta
      name="description"
      content="A little pinning-day surprise: pin the SUNN badge, sign the name tag, and see your final report card. Congratulations on your deployment, future teacher!"
    />
    <meta name="theme-color" content="#1d3b35" />
    <meta name="color-scheme" content="light dark" />

    <!-- Open Graph (Messenger, Facebook, Viber) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pinning Day" />
    <meta property="og:title" content="Congratulations on your deployment! 🍎" />
    <meta
      property="og:description"
      content="Pinning and deployment day is here. Tap the SUNN pin to make it official — with a report card and a bouquet waiting for you."
    />
    <meta property="og:image" content="/src/assets/sunn-logo.png" />
    <meta property="og:image:alt" content="SUNN pin badge" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Congratulations on your deployment! 🍎" />
    <meta
      name="twitter:description"
      content="Pinning and deployment day is here. Tap the SUNN pin to make it official."
    />
    <meta name="twitter:image" content="/src/assets/sunn-logo.png" />

    <link rel="icon" type="image/png" href="/src/assets/sunn-logo.png" />
    <link rel="apple-touch-icon" href="/src/assets/sunn-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Patrick+Hand&display=swap" rel="stylesheet" />
